name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install

      - name: Install Android Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt zipalign apksigner dalvik-exchange

      - name: Build and Sign HeyNote APK
        run: |
          chmod +x ./scripts/build_apk.sh
          ./scripts/build_apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heynote-release-apk
          path: heynote.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tags or manual trigger)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            heynote.apk
            heynote-v1.0.4-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### 📱 HeyNote Android App Release
            - Download and install `heynote.apk` on your Android device.
            - Includes bilingual voice note taking, 1-tap mic lock-screen widget, offline voice recognition, and Gemini features.
